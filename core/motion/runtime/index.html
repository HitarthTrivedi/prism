<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prism Motion Graphics Runtime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=block" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #motionCanvas {
      display: block;
      image-rendering: -webkit-optimize-contrast;
    }
  </style>
</head>
<body>
  <canvas id="motionCanvas" width="1080" height="1920"></canvas>

  <script src="effects.js"></script>
  <script src="runtime.js"></script>
  <script src="primitives.js"></script>
  <script src="domains/ui.js"></script>
  <script src="domains/charts.js"></script>
  <script src="domains/diagrams.js"></script>
  <script>
    const canvas = document.getElementById("motionCanvas");
    const runtime = new MotionRuntime(canvas);
    window.__runtime = runtime;
    window.__ready = true;

    window.__loadSpec = function(specJson) {
      const spec = typeof specJson === "string" ? JSON.parse(specJson) : specJson;
      runtime.loadSpec(spec);
      return {
        width: runtime.width,
        height: runtime.height,
        fps: runtime.fps,
        duration: runtime.duration,
        totalFrames: Math.round(runtime.duration * runtime.fps)
      };
    };

    window.__seek = function(frame) {
      runtime.seek(frame);
      return true;
    };

    // 0 once every ImageNode has either loaded or errored — see
    // MotionRuntime.pendingImageCount()'s comment in runtime.js. A capture
    // loop must poll this down to 0 before seeking frame 0, or a slow
    // network image can still be showing its loading placeholder on a
    // frame where it should already be fully visible.
    window.__pendingImages = function() {
      return runtime.pendingImageCount();
    };
  </script>
</body>
</html>
